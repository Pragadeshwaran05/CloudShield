<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CloudShield | Login</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050b14;
            color: white;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 390px;
            max-width: 92%;
            padding: 35px;
            background: #0c1624;
            border: 1px solid rgba(0, 191, 255, 0.15);
            border-radius: 18px;
            box-shadow: 0 25px 80px rgba(0,0,0,.45);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .logo h1 {
            font-size: 27px;
        }

        .logo p {
            margin-top: 8px;
            color: #7f90a4;
            font-size: 13px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #aab8c8;
            font-size: 13px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border-radius: 8px;
            border: 1px solid #26384d;
            background: #07111d;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #00bfff;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #00bfff, #246bff);
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .error {
            margin-bottom: 18px;
            padding: 11px;
            border-radius: 7px;
            background: rgba(255, 60, 60, .1);
            border: 1px solid rgba(255, 60, 60, .25);
            color: #ff8b8b;
            font-size: 13px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #75869a;
            text-decoration: none;
            font-size: 13px;
        }

    </style>
</head>

<body>

    <div class="login-card">

        <div class="logo">

            <div class="logo-icon">
                🛡️
            </div>

            <h1>CloudShield</h1>

            <p>
                Cloud Security Monitoring & Threat Detection
            </p>

        </div>


        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div class="error">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <form method="POST">

            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >


            <button type="submit">
                Sign In
            </button>

        </form>


        <a href="/" class="back">
            ← Back to CloudShield
        </a>

    </div>

</body>
</html>
